# ---------------------------------------------------------------------------
# Pipeline de automação mobile — native-demo-app
#
# Executar um emulador Android dentro de um runner compartilhado do GitLab
# exige KVM/virtualização, que normalmente não está disponível. Por isso os
# testes mobile do pipeline rodam em dispositivos reais do BrowserStack.
#
# Nenhum segredo fica neste arquivo: cadastre em
# Settings > CI/CD > Variables (marcadas como "Masked" e "Protected"):
#   BROWSERSTACK_USERNAME
#   BROWSERSTACK_ACCESS_KEY
#   BROWSERSTACK_APP_ID   (opcional — se ausente, o pipeline envia o app)
# ---------------------------------------------------------------------------

stages:
  - install
  - validate
  - test
  - report

default:
  image: node:22-bookworm
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

variables:
  NODE_ENV: test
  TEST_ENV: BrowserStack
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

# Roda em merge requests e em pushes de branch, sem duplicar o pipeline
# quando a branch já possui um MR aberto.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH

.npm_cache: &npm_cache
  key:
    files:
      - package-lock.json
    prefix: npm
  paths:
    - .npm/
  policy: pull

# Jobs que precisam das dependencias herdam este template. O cache guarda
# apenas o diretorio de download do npm (.npm/), nunca node_modules: com o
# cache quente o `npm ci` resolve tudo offline, sem trafegar ~260 MB entre
# jobs nem consumir cota de artefatos.
.with_dependencies:
  cache: *npm_cache
  before_script:
    - npm ci --prefer-offline --no-audit --no-fund

# ---------------------------------------------------------------------------
# 1. Instalação de dependências
# ---------------------------------------------------------------------------
# Aquece o cache do npm para os demais stages. Nao publica artefatos:
# node_modules e reconstruido em cada job a partir do cache.
install:dependencies:
  stage: install
  cache:
    key:
      files:
        - package-lock.json
      prefix: npm
    paths:
      - .npm/
    policy: pull-push
  script:
    - node --version && npm --version
    - npm ci --no-audit --no-fund
    - npm ls --depth=0 || true

# ---------------------------------------------------------------------------
# 2. Validações estáticas (não dependem de device nem de credenciais)
# ---------------------------------------------------------------------------
validate:project:
  stage: validate
  extends: .with_dependencies
  needs:
    - job: install:dependencies
      artifacts: false
  script:
    - npm run validate:selectors
    - npm run validate:selectors -- --platform=ios
    - npm run validate:configs
    - npm run validate:specs

# ---------------------------------------------------------------------------
# 3. Testes em dispositivos reais (BrowserStack)
# ---------------------------------------------------------------------------
test:browserstack:
  stage: test
  extends: .with_dependencies
  needs:
    - job: install:dependencies
      artifacts: false
  rules:
    # Só executa quando as credenciais estiverem cadastradas no projeto.
    - if: $BROWSERSTACK_USERNAME && $BROWSERSTACK_ACCESS_KEY
      when: always
    - when: never
  script:
    - |
      if [ -z "$BROWSERSTACK_APP_ID" ]; then
        echo "BROWSERSTACK_APP_ID não definido — baixando e enviando o app"
        npm run app:download -- --platform=android
        BROWSERSTACK_APP_ID=$(npm run --silent app:upload -- --platform=android | grep -oE 'bs://[A-Za-z0-9]+' | head -1)
        export BROWSERSTACK_APP_ID
      fi
      test -n "$BROWSERSTACK_APP_ID" || { echo "Falha ao obter o app_url do BrowserStack"; exit 1; }
    - npm run test:browserstack
  artifacts:
    # Evidências precisam ser preservadas mesmo (principalmente) quando falha.
    when: always
    expire_in: 1 week
    paths:
      - allure-results/
      - screenshots/
      - logs/

# ---------------------------------------------------------------------------
# 4. Relatório Allure
# ---------------------------------------------------------------------------
report:allure:
  stage: report
  needs:
    - job: install:dependencies
      artifacts: false
    - job: test:browserstack
      artifacts: true
      optional: true
  cache: *npm_cache
  when: always
  before_script:
    # O allure-commandline e uma aplicacao Java.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends default-jre-headless
    - npm ci --prefer-offline --no-audit --no-fund
  script:
    - mkdir -p allure-results
    - npm run report:generate
  artifacts:
    when: always
    expire_in: 1 month
    paths:
      - allure-report/
      - allure-results/
      - screenshots/
      - logs/

# ---------------------------------------------------------------------------
# 5. Publicação do relatório no GitLab Pages (apenas na branch padrão)
# ---------------------------------------------------------------------------
pages:
  stage: report
  needs:
    - job: report:allure
      artifacts: true
  rules:
    # when: always — o relatorio precisa ser publicado JUSTAMENTE quando algo
    # falha. O `needs` abaixo continua impedindo a publicacao se o proprio
    # report:allure nao gerar o relatorio.
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always
  script:
    - rm -rf public && mv allure-report public
  artifacts:
    paths:
      - public
